# Construye la imagen, la prueba en CPU y la publica en GHCR (ghcr.io/<owner>/cutout-gpu).
# En el repo de build vive en .github/workflows/build.yml.
# HF_TOKEN (secreto, opcional): con él SAM 3 y RMBG-2.0 se bajan de sus repos oficiales
# (gated); sin él, de copias públicas cuyo model.safetensors se verifica por SHA-256.
name: build-image
on:
  push:
    branches: [main, v3]
  workflow_dispatch:
    inputs:
      models:
        description: "Modelos a incluir (CUTOUT_MODELS)"
        default: "birefnet,rmbg2,ben2,sam3"
permissions:
  contents: read
  packages: write
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cutout-gpu
      MODELS: ${{ github.event.inputs.models || 'birefnet,rmbg2,ben2,sam3' }}
    steps:
      - name: Liberar disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy || true
          docker system prune -af || true
          df -h /
      - uses: actions/checkout@v4
      - name: Token de Hugging Face (opcional)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "Sin HF_TOKEN: SAM 3 y RMBG-2.0 se bajan de copias públicas verificadas por SHA-256"; fi
      - name: Construir imagen
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DOCKER_BUILDKIT: "1"
        run: |
          docker build --secret id=hf_token,env=HF_TOKEN --build-arg CUTOUT_MODELS="$MODELS" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t cutout:ci .
          docker images cutout:ci
      - name: Tests de la lógica de máscara y del contrato HTTP (modelos falsos)
        run: |
          docker run --rm -v "$PWD:/w" cutout:ci python /w/test_postproc.py
          docker run --rm -v "$PWD:/w" cutout:ci python /w/test_server_fake.py
      - name: Carga en CPU de los modelos base alternativos (si van en la imagen)
        run: |
          EXTRA=$(echo "$MODELS" | tr ',' '\n' | grep -Ex 'rmbg2|ben2' | tr '\n' ' ')
          if [ -n "$EXTRA" ]; then docker run --rm -v "$PWD:/w" cutout:ci python /w/check_models.py $EXTRA; else echo "sin modelos base alternativos en esta imagen"; fi
      - name: Prueba de humo en CPU
        run: |
          TOKEN=ci-smoke-token
          HASH=$(printf %s "$TOKEN" | sha256sum | cut -d' ' -f1)
          # En CPU: un solo modelo base y SAM 3 a 560 px para caber en la RAM del runner.
          docker run -d --name cut -p 9000:9000 -e CUTOUT_TOKEN_SHA256="$HASH" -e CUTOUT_ALLOW_DEBUG=1 \
            -e CUTOUT_BASE_MODELS=birefnet -e SAM3_IMAGE_SIZE=560 cutout:ci
          docker run --rm --network host -v "$PWD:/w" cutout:ci python /w/smoke_test.py http://127.0.0.1:9000 "$TOKEN"
      - name: Logs del servidor
        if: always()
        run: docker logs cut 2>&1 | tail -150 || true
      - name: Publicar en GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAG=$(echo "$GITHUB_SHA" | cut -c1-12)
          # Una imagen con otro juego de modelos lleva sufijo, para no pisar la completa.
          if [ "$MODELS" != "birefnet,rmbg2,ben2,sam3" ]; then TAG="$TAG-$(echo "$MODELS" | tr ',' '-')"; fi
          docker tag cutout:ci "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          if [ "${{ github.ref_name }}" = "main" ]; then docker tag cutout:ci "$IMAGE:latest" && docker push "$IMAGE:latest"; fi
          echo "Imagen publicada: $IMAGE:$TAG (modelos: $MODELS)" >> "$GITHUB_STEP_SUMMARY"
